name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: agenda_push_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PUSH_TEST_DATABASE_URL: postgresql://postgres:test-only@127.0.0.1:5432/agenda_push_test
      INTERESSES_TEST_DATABASE_URL: postgresql://postgres:test-only@127.0.0.1:5432/agenda_interesses_test
    defaults:
      run:
        working-directory: api-igreja
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api-igreja/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: npm run check

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Prepare isolated interests database
        run: docker exec "${{ job.services.postgres.id }}" createdb -U postgres agenda_interesses_test

      - name: Run tests
        run: npm test

      - name: Verify migration history and replay
        run: node scripts/verificar-migrations-teste.js

  app:
    name: App
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: agenda_web_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: app-igreja
    env:
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_API_URL: http://localhost:3000
      EXPO_PUBLIC_PUSH_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-igreja/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Network resilience tests
        run: npm run test:network

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Dependency compatibility tests
        run: node --test tests/dependencies.test.cjs

      - name: PWA tests
        run: node --test tests/pwa.test.mjs

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Export web build
        run: npx expo export --platform web --output-dir "$RUNNER_TEMP/agenda-adp-web"

      - name: Verify PWA export
        run: node tests/check-pwa-export.mjs "$RUNNER_TEMP/agenda-adp-web"

      - name: Install browser for web resilience test
        run: npx playwright install --with-deps chromium

      - name: Browser resilience test
        run: node tests/check-web-resilience.mjs "$RUNNER_TEMP/agenda-adp-web" "$RUNNER_TEMP/agenda-adp-resilience"

      - name: Install API for browser integration
        run: npm ci --prefix ../api-igreja

      - name: Browser end-to-end with PostgreSQL
        env:
          WEB_TEST_DATABASE_URL: postgresql://postgres:test-only@127.0.0.1:5432/agenda_web_test
        run: node tests/check-web-e2e.mjs "$RUNNER_TEMP/agenda-adp-web" "$RUNNER_TEMP/agenda-adp-e2e"
